name: Course CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen
          npm --prefix frontend ci --no-audit --no-fund
          test -x /usr/bin/google-chrome
      - name: Verify Python and real browsers
        run: ./tools/course_verify.sh
      - name: Build CPU image
        run: docker build --build-arg GUIDE_RELEASE_ID="$GITHUB_SHA" -t "exhibition-course:$GITHUB_SHA" .
      - name: Smoke-test container readiness
        run: |
          docker run -d --name course-ci --volume course-ci-data:/data --read-only --tmpfs /tmp -p 127.0.0.1:8090:8080 "exhibition-course:$GITHUB_SHA"
          for n in $(seq 1 60); do
            if curl --fail http://127.0.0.1:8090/health > /tmp/health.json; then break; fi
            sleep 2
          done
          python -c 'import json,os; x=json.load(open("/tmp/health.json")); assert x["status"] == "ok" and x["release"] == os.environ["GITHUB_SHA"]'
          DEMO_BASE_URL=http://127.0.0.1:8090 node tests/frontend/demo-system.cjs
          docker rm -f course-ci
      - name: Package verified image
        run: |
          mkdir -p release
          docker save "exhibition-course:$GITHUB_SHA" -o release/image.tar
          python tools/course_deploy.py manifest --sha "$GITHUB_SHA" --image-tar release/image.tar --output release/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'course-image' || 'course-qa-image' }}-${{ github.sha }}
          path: release/
          retention-days: 14
          compression-level: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_id }}
          path: docs/dev/**/evidence/
          retention-days: 7
