<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>语音体验</title>
<style>body{font:18px/1.6 system-ui;max-width:880px;margin:24px auto;padding:0 20px;background:#f3f6fa;color:#162334;text-align:center}h1{font-size:30px;margin:12px}video{display:block;width:min(100%,480px);height:min(65vh,640px);object-fit:contain;background:#172230;margin:20px auto;border-radius:16px}button{font:inherit;padding:12px 20px;margin:6px;border:0;border-radius:10px;background:#1463d6;color:white;cursor:pointer}button:disabled{background:#ccd5e2;color:#586678;cursor:default}#status{min-height:3em;padding:12px;background:white;border-radius:12px}details{text-align:left;margin:24px 0;padding:16px;background:white;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:320px;overflow:auto}.hint{color:#526172}audio{max-width:100%}</style>
<h1>语音体验</h1><p>听到数字人说话后，直接开口打断；结束后回放自己的声音。</p><video id="remote" playsinline autoplay></video>
<p id="status" role="status">点击“开始测试”，允许麦克风后稍等数字人开口。</p><button id="start">开始测试</button><button id="stop" disabled>停止</button><button id="replay" disabled>回放我的声音</button>
<p class="hint">保持本页在前台。每轮结束后保留录音供本地回放；回放时也可点击“开始测试”，开始新的一轮。</p><audio id="replayAudio" hidden></audio>
<details><summary>诊断信息</summary><p id="device">尚未开启麦克风。</p><p>本地静音不等于服务器旧音已停止。录音只在本页内存中，刷新会清除。</p><pre id="connectionDiagnostics"></pre><pre id="details"></pre></details>
